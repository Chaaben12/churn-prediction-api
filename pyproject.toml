[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "churn-api"
version = "0.1.0"
description = "Customer churn prediction API - MLOps portfolio project 1"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chaaben12" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "pandas>=3.0",
    "pydantic-settings>=2.7",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]
eda = [
    "pandas>=3.0",
    "matplotlib>=3.9",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]
training = [
    "joblib>=1.4",
    "pandas>=3.0",
    "scikit-learn>=1.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/churn_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "training", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
