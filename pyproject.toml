[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "churn-api"
version = "0.1.0"
description = "Customer churn prediction API - MLOps portfolio project 1"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chaaben12" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/churn_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "training", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
