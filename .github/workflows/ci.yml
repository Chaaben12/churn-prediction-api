name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy src training

      - name: Pytest (coverage gate >= 80%)
        run: uv run pytest

      - name: Upload coverage report
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: churn-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name api -p 8000:8000 churn-api:ci

      - name: Wait for service readiness
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "service is ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::service did not become healthy within 30s"
          docker logs api
          exit 1

      - name: Smoke test endpoints
        run: |
          curl -sf http://localhost:8000/model/info \
            | jq -e '.model_version | length > 0' > /dev/null
          echo "/model/info OK"
          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            --data "$(jq -c '{customers: .}' tests/data/sample_customers.json)" \
            | jq -e '.predictions
                     | length == 3
                     and .[0].churn_probability >= 0
                     and .[0].churn_probability <= 1' > /dev/null
          echo "/predict OK (batch of 3)"
          code=$(
            curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict \
              -H 'Content-Type: application/json' \
              --data '{"customers": []}'
          )
          [ "$code" = "422" ] || { echo "::error::expected 422 for empty batch, got $code"; exit 1; }
          echo "/predict validation OK (empty batch rejected with 422)"

      - name: Report image size
        run: |
          BYTES=$(docker image inspect churn-api:ci --format '{{.Size}}')
          MB=$((BYTES / 1000000))
          echo "uncompressed image size: ${MB} MB"
          {
            echo "### Docker image"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| Uncompressed size | ${MB} MB |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop container
        if: always()
        run: docker rm -f api || true

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag churn-api:ci "${IMAGE}:${VERSION}"
          docker tag churn-api:ci "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
